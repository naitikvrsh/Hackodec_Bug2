services:
  - type: web
    name: aegisguard-firewall
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
